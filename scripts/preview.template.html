<title>산타 경로 검증기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위쪽 정지형 세계 지도(경도선 위 자정선 + 산타), 그 아래 시각 조작 막대, 상태 패널과 도착표 두 칸 */
:root {
  --bg: #eef2f7;
  --panel: #ffffff;
  --ink: #142036;
  --ink-soft: #55627a;
  --rule: #d6dde8;
  --sea: #10213f;
  --sea-grid: #22385e;
  --gold: #f2c14e;
  --red: #d6453b;
  --done: #8fa3c4;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1424; --panel: #142036; --ink: #e3e9f3; --ink-soft: #9aa8bf; --rule: #26344d;
    --sea: #0a172d; --sea-grid: #1c2f50; --gold: #f5cb64; --red: #ef6a5f; --done: #6c80a3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1424; --panel: #142036; --ink: #e3e9f3; --ink-soft: #9aa8bf; --rule: #26344d;
  --sea: #0a172d; --sea-grid: #1c2f50; --gold: #f5cb64; --red: #ef6a5f; --done: #6c80a3; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap {
  max-width: 1120px; margin: 0 auto; display: grid; gap: 18px;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { margin: 0; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--ink-soft); max-width: 68ch; }
.rule-box { font-family: var(--mono); font-size: 0.85rem; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; display: inline-block; margin-top: 10px; }

.map { position: relative; border-radius: 10px; overflow: hidden; background: var(--sea); }
canvas { display: block; width: 100%; aspect-ratio: 2 / 1; max-width: 100%; }
.legend { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.75rem; color: #c9d6ee; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
.clock { font-family: var(--mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; min-width: 15ch; }
input[type="range"] { flex: 1 1 260px; accent-color: var(--red); min-width: 0; }
button { font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--ink-soft); }
button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button.play { background: var(--red); color: #fff; border-color: var(--red); min-width: 5.5em; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.group { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.group span { font-size: 0.8rem; color: var(--ink-soft); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 10px; font-size: 1rem; }
dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; }
dt { color: var(--ink-soft); font-size: 0.85rem; }
dd { margin: 0; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 1px 10px; border-radius: 999px; }
.pill.before, .pill.after { background: var(--rule); color: var(--ink); }
.pill.visiting { background: var(--gold); color: #142036; }
.pill.flying { background: var(--red); color: #fff; }
.bar { height: 8px; background: var(--rule); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--red); }
.big { font-size: 1.7rem; font-weight: 700; line-height: 1.2; }

.table-wrap { max-height: 460px; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--panel); font-weight: 500; color: var(--ink-soft); font-size: 0.8rem; }
td.mono { font-family: var(--mono); font-size: 0.82rem; }
tr.done td { color: var(--ink-soft); }
tr.current td { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--ink); font-weight: 700; }
tr.kr td:nth-child(2)::after { content: " · 한국"; color: var(--ink-soft); font-weight: 400; font-size: 0.75rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main class="wrap">
  <header>
    <h1>산타 경로 검증기</h1>
    <p class="sub">샘플 도시 53곳으로 경로 계산 로직을 확인하는 화면이에요. 산타는 노란 세로선(지금 막 자정이 된 경도)을 따라 동에서 서로 움직여요. 시각을 옮기거나 재생해서 산타가 한 방향으로만 도는지 보세요.</p>
    <div class="rule-box">도착 시각(UTC) = 12월 25일 00:00 UTC − 보정 경도 ÷ 15시간</div>
  </header>

  <div class="map">
    <canvas id="map" role="img" aria-label="세계 지도 위 산타의 현재 위치"></canvas>
    <div class="legend" aria-hidden="true">
      <span><i style="background:#d6453b"></i>산타</span>
      <span><i style="background:#f2c14e"></i>다녀간 도시</span>
      <span><i style="background:#5b7299"></i>남은 도시</span>
      <span><i style="background:transparent;border:1px dashed #f2c14e;border-radius:0;width:2px"></i>지금 자정인 경도</span>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="play" id="play">재생</button>
    <span class="clock" id="clock">-</span>
    <label for="time" class="group"><span>시각</span></label>
    <input type="range" id="time" min="0" max="1000" value="0">
    <div class="group" role="group" aria-label="재생 속도">
      <span>속도</span>
      <button type="button" id="sp60" data-speed="60" aria-pressed="false">1초=1분</button>
      <button type="button" id="sp600" data-speed="600" aria-pressed="true">1초=10분</button>
      <button type="button" id="sp3600" data-speed="3600" aria-pressed="false">1초=1시간</button>
    </div>
    <div class="group" role="group" aria-label="바로 가기">
      <span>바로 가기</span>
      <button type="button" id="j-start" data-jump="start">첫 출발</button>
      <button type="button" id="j-seoul" data-jump="seoul">서울 도착 직전</button>
      <button type="button" id="j-kashgar" data-jump="kashgar">카슈가르</button>
      <button type="button" id="j-end" data-jump="end">마지막 도시</button>
    </div>
  </div>

  <div class="cols">
    <section class="panel" aria-live="polite">
      <h2>지금 상태</h2>
      <dl>
        <dt>상태</dt><dd><span class="pill" id="status">-</span></dd>
        <dt>위치</dt><dd id="where">-</dd>
        <dt>비행 진행률</dt><dd><span id="prog">-</span><div class="bar"><i id="progBar" style="width:0"></i></div></dd>
        <dt>지나온 도시</dt><dd id="visited">-</dd>
        <dt>좌표</dt><dd id="coord" style="font-family:var(--mono);font-size:.85rem">-</dd>
        <dt>서울까지</dt><dd><span class="big" id="countdown">-</span></dd>
      </dl>
    </section>
    <section class="panel">
      <h2>도착표</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>도시</th><th>한국 시각</th><th>현지 시각</th><th>보정 경도</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
/*__SANTA_CORE__*/

(() => {
  const route = buildRoute(CITIES, 2026);
  const HOURMS = 3600000;
  const KST = 9 * HOURMS;
  const T0 = Date.UTC(2026, 11, 24, 9);   // 한국 시각 12/24 18:00
  const T1 = Date.UTC(2026, 11, 25, 12);  // 한국 시각 12/25 21:00
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const fmtKst = (ms) => { const d = new Date(ms + KST); return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
  const fmtLocal = (s) => { const d = new Date(s.arriveUtc + s.utcOffset * HOURMS); return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
  const KR = new Set(['seoul', 'busan', 'daegu', 'daejeon', 'gwangju', 'incheon', 'jeju']);

  let now = route[0].arriveUtc - 20 * 60000;
  let speed = 600;
  let playing = false;

  // 도착표
  const tbody = $('#rows');
  const rowEls = route.map((s, i) => {
    const tr = document.createElement('tr');
    if (KR.has(s.id)) tr.className = 'kr';
    tr.innerHTML = `<td>${i + 1}</td><td></td><td class="mono">${fmtKst(s.arriveUtc)}</td><td class="mono">${fmtLocal(s)}</td><td class="mono">${s.effLon.toFixed(1)}°</td>`;
    tr.children[1].textContent = s.name;
    tbody.appendChild(tr);
    return tr;
  });

  // 지도
  const cv = $('#map');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  const X = (lon) => ((lon + 180) / 360) * W;
  const Y = (lat) => ((90 - lat) / 180) * H;
  const wrapLon = (l) => ((((l + 180) % 360) + 360) % 360) - 180;
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function arc(a, b, dashed) {
    ctx.beginPath();
    let px = null;
    for (let k = 0; k <= 24; k++) {
      const p = greatCircle(a, b, k / 24);
      const x = X(p.lon), y = Y(p.lat);
      if (px === null || Math.abs(x - px) > W / 2) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      px = x;
    }
    ctx.setLineDash(dashed ? [3, 5] : []);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function draw() {
    if (!W) return;
    const s = santaAt(now, route);
    ctx.fillStyle = css('--sea'); ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = css('--sea-grid'); ctx.lineWidth = 1;
    for (let lon = -180; lon <= 180; lon += 30) { ctx.beginPath(); ctx.moveTo(X(lon), 0); ctx.lineTo(X(lon), H); ctx.stroke(); }
    for (let lat = -60; lat <= 60; lat += 30) { ctx.beginPath(); ctx.moveTo(0, Y(lat)); ctx.lineTo(W, Y(lat)); ctx.stroke(); }
    ctx.fillStyle = '#5f78a3'; ctx.font = '10px IBM Plex Mono, monospace';
    for (let lon = -150; lon <= 150; lon += 60) ctx.fillText(`${lon}°`, X(lon) + 3, 12);

    // 지금 막 자정이 된 경도 (산타가 따라가는 선)
    const midLon = wrapLon(((Date.UTC(2026, 11, 25) - now) / HOURMS) * 15);
    if (s.status !== 'before' && s.status !== 'after') {
      ctx.strokeStyle = css('--gold'); ctx.globalAlpha = 0.55; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(X(midLon), 0); ctx.lineTo(X(midLon), H); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }

    // 경로
    ctx.lineWidth = 1.5;
    for (let i = 1; i < route.length; i++) {
      const done = i < s.visitedCount;
      ctx.strokeStyle = done ? css('--gold') : 'rgba(120,145,190,.35)';
      if (done || i === s.visitedCount) {
        if (i === s.visitedCount && s.status === 'flying') { ctx.strokeStyle = 'rgba(120,145,190,.5)'; }
        arc(route[i - 1], route[i], !done);
      }
    }
    // 도시
    route.forEach((c, i) => {
      const done = i < s.visitedCount;
      ctx.fillStyle = done ? css('--gold') : '#5b7299';
      ctx.beginPath(); ctx.arc(X(c.lon), Y(c.lat), KR.has(c.id) ? 2.4 : 3, 0, Math.PI * 2); ctx.fill();
    });
    // 산타
    if (s.status !== 'before' && s.status !== 'after') {
      const x = X(s.lon), y = Y(s.lat);
      ctx.fillStyle = 'rgba(214,69,59,.3)'; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d6453b'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      const label = s.status === 'visiting' ? s.prev.name : `${s.prev.name} → ${s.next.name}`;
      ctx.font = '600 12px IBM Plex Sans KR, sans-serif';
      const tw = ctx.measureText(label).width;
      const lx = Math.min(Math.max(x - tw / 2 - 6, 4), W - tw - 16);
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(lx, y - 32, tw + 12, 18);
      ctx.fillStyle = '#142036'; ctx.fillText(label, lx + 6, y - 19);
    } else {
      ctx.fillStyle = '#c9d6ee'; ctx.font = '600 13px IBM Plex Sans KR, sans-serif';
      ctx.fillText(s.status === 'before' ? '산타는 북극에서 출발 준비 중' : '모든 배달 완료 · 북극으로 귀환', 12, 28);
    }
  }

  // 상태 패널
  const STATUS = { before: '출발 전', visiting: '배달 중', flying: '비행 중', after: '배달 완료' };
  let lastCurrent = -1;
  function updatePanel() {
    const s = santaAt(now, route);
    $('#clock').textContent = `한국 ${fmtKst(now)}`;
    const st = $('#status'); st.textContent = STATUS[s.status]; st.className = `pill ${s.status}`;
    $('#where').textContent = s.status === 'before' ? `북극 → 첫 도시 ${s.next.name}`
      : s.status === 'after' ? '북극'
      : s.status === 'visiting' ? `${s.prev.name}에 머무는 중` : `${s.prev.name} → ${s.next.name}`;
    $('#prog').textContent = s.status === 'flying' ? `${Math.round(s.progress * 100)}%` : '-';
    $('#progBar').style.width = `${s.status === 'flying' ? s.progress * 100 : 0}%`;
    $('#visited').textContent = `${s.visitedCount} / ${route.length}곳`;
    $('#coord').textContent = `${s.lat.toFixed(2)}, ${s.lon.toFixed(2)}`;
    const left = timeUntil('seoul', now, route);
    const hh = Math.floor(left / HOURMS), mm = Math.floor((left % HOURMS) / 60000);
    $('#countdown').textContent = left === 0 ? '다녀갔어요' : hh > 0 ? `${hh}시간 ${mm}분` : left < 60000 ? '1분 이내' : `${mm}분`;
    const cur = s.status === 'flying' ? s.visitedCount : s.visitedCount - 1;
    rowEls.forEach((tr, i) => {
      tr.classList.toggle('done', i < s.visitedCount && i !== cur);
      tr.classList.toggle('current', i === cur);
    });
    if (cur !== lastCurrent && cur >= 0 && rowEls[cur]) {
      lastCurrent = cur;
      const box = tbody.closest('.table-wrap'), row = rowEls[cur];
      box.scrollTop = Math.max(0, row.offsetTop - box.clientHeight / 2);
    }
    $('#time').value = String(Math.round(((now - T0) / (T1 - T0)) * 1000));
  }
  function render() { draw(); updatePanel(); }

  // 조작
  $('#time').addEventListener('input', (e) => { now = T0 + (Number(e.target.value) / 1000) * (T1 - T0); render(); });
  const playBtn = $('#play');
  playBtn.addEventListener('click', () => { playing = !playing; playBtn.textContent = playing ? '일시정지' : '재생'; last = performance.now(); });
  document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll('[data-speed]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  const at = (id) => route.find((r) => r.id === id).arriveUtc;
  const JUMP = {
    start: () => route[0].arriveUtc - 2 * 60000,
    seoul: () => at('seoul') - 3 * 60000,
    kashgar: () => at('kashgar') - 6 * 60000,
    end: () => route[route.length - 1].arriveUtc - 10 * 60000,
  };
  document.querySelectorAll('[data-jump]').forEach((b) => b.addEventListener('click', () => { now = JUMP[b.dataset.jump](); render(); }));

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    if (playing) {
      now += dt * 1000 * speed;
      if (now > T1) { now = T1; playing = false; playBtn.textContent = '재생'; }
      render();
    }
    requestAnimationFrame(frame);
  }
  new ResizeObserver(resize).observe(cv);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  resize(); updatePanel();
  requestAnimationFrame(frame);
})();
</script>
